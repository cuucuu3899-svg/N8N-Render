version: "1"
services:
  - type: web
    name: n8n-app
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    region: singapore
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://n8n-app-jdk1.onrender.com/
